<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vokto</title>
    <style>
      html, body, #root {
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // The window is click-through by default (main sets ignoreMouseEvents).
      // The renderer reports whether the cursor is over the actual pill so the
      // OS only lets clicks land when the pointer is ON the pill — everything
      // around it falls straight through to the app below.
      (function () {
        let inside = false;
        let lastX = 0;
        let lastY = 0;
        // A small halo around the card so grabbing right at the edge/tip of the
        // capsule (or just past it) still registers instead of flickering the
        // click-through toggle on and off.
        const INFLATE = 10;
        function overBar() {
          const el = document.getElementById('vq-bar');
          if (!el) return false;
          const r = el.getBoundingClientRect();
          return (
            lastX >= r.left - INFLATE &&
            lastX <= r.right + INFLATE &&
            lastY >= r.top - INFLATE &&
            lastY <= r.bottom + INFLATE
          );
        }
        function sync() {
          const over = overBar();
          if (over !== inside) {
            inside = over;
            if (window.vqOverlay && window.vqOverlay.cursorRegion) {
              window.vqOverlay.cursorRegion(over);
            }
          }
        }
        window.addEventListener('pointermove', function (e) {
          lastX = e.clientX;
          lastY = e.clientY;
          sync();
        });
        window.addEventListener('pointerleave', function () {
          if (inside) {
            inside = false;
            if (window.vqOverlay && window.vqOverlay.cursorRegion) {
              window.vqOverlay.cursorRegion(false);
            }
          }
        });
      })();
    </script>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
